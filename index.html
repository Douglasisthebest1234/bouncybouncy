<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trampoline Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <h1>Trampoline</h1>
    <div class="stat">Bounces <strong id="bounces">0</strong></div>
    <label class="control">
      <span>Bounce height <output id="heightOut"></output></span>
      <input id="height" type="range" min="120" max="500" step="10" value="320">
    </label>
    <button id="drop" type="button">Drop ball</button>
    <p class="hint">Click anywhere to drop the ball there.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
