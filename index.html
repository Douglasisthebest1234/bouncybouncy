<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trampoline Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Trampoline</h1>
      <div class="stat">Bounces <strong id="bounces">0</strong></div>

      <h2>Choose a ball</h2>
      <div id="balls" class="ball-grid"></div>

      <label class="control">
        <span>Bounce height <output id="heightOut"></output></span>
        <input id="height" type="range" min="120" max="450" step="10" value="320">
      </label>
      <button id="drop" type="button">Drop ball</button>
      <p class="hint">Click the sky to drop the ball there.</p>
    </aside>

    <main class="stage">
      <canvas id="scene"></canvas>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
